name: flutter_application
description: A faithful replica of Spotify login UI in Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/spotify.png
    - assets/google.png
    - assets/facebook.png
    - assets/apple.png
    - assets/email.png